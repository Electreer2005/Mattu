<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Mattu</title>
    <link rel="icon" href="Img/Logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Css/styles.css">
    <link rel="stylesheet" href="/Css/auth.css">
</head>

<body>
    <div class="container">
        <div class="container-form">
            <form action="" method="post" class="sign-in">
                <h2>Acceso</h2>

                <div class="Input-group">
                    <label for="Correo">Correo</label>
                    <div class="Input-box">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="" id="" placeholder="Ingrese su correo" required>
                    </div>
                </div>
                <div class="Input-group">
                    <label for="password">Contraseña</label>
                    <div class="Input-box">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Ingrese su contraseña"
                            required>
                        <button type="button" class="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="Forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button class="btn btn-primario">Acceder</button>
                <div class="social-network">
                    <p>o inicia con:</p>
                    <div class="button-social">
                        <button class="btn Facebook"><i class="fa-brands fa-facebook"></i></button>
                        <button class="btn Google"><i class="fa-brands fa-google"></i></button>
                    </div>
                </div>
            </form>
        </div>
        <div class="container-form">
            <form action="" method="post" class="sign-up">
                <h2>Registro</h2>

                <div class="Input-group">
                    <label for="Nombre">Nombre</label>
                    <div class="Input-box">
                        <i class="fas fa-user"></i>
                        <input type="text" name="" id="" placeholder="Ingrese su nombre" required>
                    </div>
                </div>
                <div class="Input-group">
                    <label for="Correo">Correo</label>
                    <div class="Input-box">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="" id="" placeholder="Ingrese su correo" required>
                    </div>
                </div>
                <div class="Input-group">
                    <label for="password">Contraseña</label>
                    <div class="Input-box">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Ingrese su contraseña"
                            required>
                        <button type="button" class="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button class="btn btn-secundario">Registrate</button>
                <div class="social-network">
                    <p>O registrate con:</p>
                    <div class="button-social">
                        <button class="btn Facebook"><i class="fa-brands fa-facebook"></i></button>
                        <button class="btn Google"><i class="fa-brands fa-google"></i></button>
                    </div>
                </div>
            </form>
        </div>
        <div class="container-welcome">
            <div class="welcome-sign-up welcome">
                <h3>¡Bienvenido!</h3>
                <p>Ingrese sus datos personales para usar todas las funciones del sitio</p>
                <button class="btn btn-pulso" id="btn-sign-up">Registrarsee</button>
            </div>
            <div class="welcome-sign-in welcome">
                <h3>¡Hola!</h3>
                <p>Registrese con sus datos personales para usar todas las funciones del sitio</p>
                <button class="btn btn-pulso" id="btn-sign-in">Iniciar Sesion</button>
            </div>
        </div>
    </div>

    <script src="Js/Auth.js"></script>
</body>

</html>
